# food-recommend-deployment.yaml
# Food Recommendation 서버의 Deployment와 Service를 하나의 파일로 정의

apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-recommend-server-deployment
  namespace: ai-services # ai-services 네임스페이스에 배포
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-recommend-server
  template:
    metadata:
      labels:
        app: food-recommend-server
    spec:
      containers:
      - name: food-recommend-server-container
        image: yunseocloud/food-recommend-server:latest
        ports:
        - containerPort: 8000
        env:
        - name: TZ
          value: "Asia/Seoul"
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: food-recommend-server-service
  namespace: ai-services # ai-services 네임스페이스에 배포
spec:
  selector:
    app: food-recommend-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP # 클러스터 내부에서만 접근 가능하도록 설정

